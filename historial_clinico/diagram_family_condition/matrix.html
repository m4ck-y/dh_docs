<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antecedentes Familiares — Matriz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Material+Symbols+Rounded:opsz@20..48&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6750A4; --on-primary: #FFFFFF;
    --primary-container: #EADDFF; --on-primary-container: #21005E;
    --surface: #FFFBFE; --surface-dim: #DED8E1;
    --surface-container: #F3EDF7; --surface-container-high: #ECE6F0;
    --on-surface: #1C1B1F; --on-surface-variant: #49454F;
    --outline: #79747E; --outline-variant: #CAC4D0;
    --error: #B3261E;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body {
    font-family: var(--font); background: var(--surface-dim); color: var(--on-surface);
    min-height: 100vh;
  }
  .app-bar {
    background: var(--surface); padding: 12px 24px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10;
  }
  .app-bar h1 { font-size: 1.15rem; font-weight: 600; color: var(--primary); }
  .app-bar .badge { font-size: .7rem; color: var(--on-surface-variant); background: var(--surface-container); padding: 3px 10px; border-radius: 999px; }
  .app-bar .summary { font-size: .78rem; color: var(--on-surface-variant); margin-left: auto; display: flex; gap: 12px; }
  .summary .total { font-weight: 600; color: var(--primary); }
  .main { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
  .matrix-wrap { overflow-x: auto; scrollbar-width: thin; }
  .matrix-grid {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) repeat(6, 95px);
    min-width: 790px;
    border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow);
  }
  .mg-header {
    background: var(--surface); font-weight: 600; font-size: .8rem;
    padding: 10px 14px; display: flex; align-items: center; justify-content: center;
    border-bottom: 2px solid var(--primary); color: var(--primary);
  }
  .mg-header:first-child { justify-content: flex-start; color: var(--on-surface-variant); font-weight: 500; font-size: .78rem; }
  .mg-cat {
    grid-column: 1 / -1;
    background: var(--surface-container); font-weight: 600; font-size: .82rem;
    padding: 10px 14px; border-bottom: 1px solid var(--outline-variant);
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .mg-cat .chevron { font-size: .7rem; transition: transform .2s; }
  .mg-cat.closed .chevron { transform: rotate(-90deg); }
  .mg-row { display: contents; }
  .mg-row .cell {
    background: var(--surface); padding: 7px 14px;
    border-bottom: 1px solid var(--outline-variant);
    display: flex; align-items: center; font-size: .82rem;
  }
  .mg-row .cell:first-child { font-weight: 500; }
  .mg-row .cell:not(:first-child) { justify-content: center; }
  .mg-row .cell input { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }
  .mg-row .cell .spec-input {
    width: 100%; height: 100%; border: none; box-sizing: border-box;
    padding: 4px 6px; background: var(--surface-container-high);
    font-family: var(--font); font-size: .72rem; outline: none;
    border-bottom: 2px solid var(--primary);
  }
  .cell:has(.spec-input) { padding: 0; }
  .mg-row .cell .code { font-size: .66rem; font-weight: 400; color: var(--on-surface-variant); background: var(--surface-container); padding: 1px 8px; border-radius: 999px; margin-left: 8px; }
  .mg-row { display: contents; }
  .mg-row.hidden-row { display: none; }
  .mg-row.hidden-cat { display: none; }
  .cat-hidden .mg-row { display: none; }
  .mg-summary {
    grid-column: 1 / -1;
    background: var(--surface-container-high); padding: 10px 14px;
    display: grid; grid-template-columns: minmax(220px, 1fr) repeat(6, 95px);
    font-size: .8rem; font-weight: 600; border-top: 2px solid var(--primary);
  }
  .mg-summary .sc { display: flex; align-items: center; justify-content: center; }
  .mg-summary .sc:first-child { justify-content: flex-start; color: var(--on-surface-variant); font-weight: 500; }
  .mg-summary .sc .num { background: var(--primary); color: var(--on-primary); padding: 2px 8px; border-radius: 999px; font-size: .72rem; min-width: 24px; text-align: center; }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding: 2px 0; }
  .filter-btn {
    flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: none;
    background: var(--surface-container-high); color: var(--on-surface-variant);
    font-family: var(--font); font-size: .78rem; font-weight: 500;
    cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .filter-btn.active { background: var(--primary); color: var(--on-primary); }
  .reset-btn { display: inline-flex; align-items: center; gap: 4px; background: var(--error); color: white; }
  .reset-btn:hover { opacity: .85; }
  .reset-btn .material-symbols-rounded { font-size: 16px; }
  @media (max-width: 640px) {
    .main { padding: 12px; }
    .matrix-grid { min-width: 670px; grid-template-columns: minmax(160px, 1fr) repeat(6, 85px); }
    .mg-header { font-size: .72rem; padding: 8px 10px; }
    .mg-row .cell { padding: 5px 10px; font-size: .78rem; }
    .mg-summary { grid-template-columns: minmax(160px, 1fr) repeat(6, 85px); }
  }
</style>
</head>
<body>
<div class="app-bar">
  <h1>Antecedentes Familiares</h1>
  <span class="badge">Matriz</span>
  <div class="summary"><span>Total: <span class="total" id="totalChecked">0</span></span></div>
</div>
<div class="main">
  <div class="filter-bar" id="filterBar"></div>
  <div class="matrix-wrap">
    <div class="matrix-grid" id="matrixGrid"></div>
  </div>
</div>

<script>
  // =========================================================================
  // MATRIX VIEW (Antecedentes Familiares)
  // -------------------------------------------------------------------------
  // UX model: a single 2D GRID renders every disease (rows, grouped by
  // category) against every family member (columns). The user ticks the cell
  // where a member has a disease. Custom "Otro" entries turn the cell into a
  // free-text input instead of a checkbox.
  //
  // Key data structures:
  //  - `matrix[diseaseKey]` -> Set<fi>
  //    `fi` is the family-member array index. EVERY disease key is COMPOSITE
  //    (`catId||disease`) — including standard diseases — so "Otro" in
  //    different categories can never collide (the original bug this design
  //    fixes). The entry exists only while at least one member is checked.
  //  - `otherSpecs[catId||Otro||fi]` -> custom "Otro" free text.
  //    Keyed PER COORDINATE (trailing `||fi`) so each member's custom text
  //    lives in its own cell and never overwrites another member's.
  //  - `catStates[catId]` -> boolean (undefined = open) for category collapse.
  //  - `activeFilter` -> currently selected category filter id (or null).
  // =========================================================================

  // The six family members. `fi` (array index) is the stable identifier used
  // everywhere (Set members, data-attributes, otherSpecs keys).
  const familyMembers = [
    'Padre', 'Madre', 'Abuelo materno', 'Abuelo paterno', 'Abuela materna', 'Abuela paterna'
  ];

  // Disease catalog. Each category has a stable `id` (`c4_N`), a label and a
  // list of diseases. Most end with an "Otro"/"Otro (Especifique)" catch-all
  // option. The trailing `(CODE)` on each disease is a FHIR/ICD reference that
  // is parsed out for display as a pill badge.
  const categories = [
    { id: 'c4_1', label: '4.1 Diabetes, colesterol y metabolismo', diseases: [
      'Diabetes (Block 2-5A1)', 'Prediabetes (5A40)', 'Obesidad (5B81)',
      'Colesterol o triglicéridos altos (5C80)', 'Hipotiroidismo (5A00)', 'Hipertiroidismo (5A02)', 'Otro'
    ]},
    { id: 'c4_2', label: '4.2 Presión alta y corazón', diseases: [
      'Presión alta (BA00)', 'Infarto (BlockL1-BA4)', 'Arritmias (BlockL1-BC6)',
      'Insuficiencia cardiaca (BlockL1-BD1)', 'Otro'
    ]},
    { id: 'c4_3', label: '4.3 Cerebro y sistema nervioso', diseases: [
      'Migraña (8A80)', 'Embolia o derrame cerebral (BlockL1-8B0)', 'Alzheimer (8A20)',
      'Demencia / Problemas de memoria (BlockL1-6D7)', 'Parkinson (8A00)', 'Epilepsias (BlockL1-8A6)',
      'Enfermedad de Huntington (8A01.10)', 'Otro'
    ]},
    { id: 'c4_4', label: '4.4 Mente, emociones y aprendizaje', diseases: [
      'Depresión (BlockL2-6A7)', 'Ansiedad (BlockL1-6B0)', 'Trastorno bipolar (BlockL2-6A6)',
      'Autismo (6A02)', 'TDAH (6A05)', 'Esquizofrenia (6A20)', 'Otro'
    ]},
    { id: 'c4_5', label: '4.5 Pulmones y respiración', diseases: [
      'Asma (CA23)', 'EPOC (CA22)', 'Rinitis alérgica (CA08)', 'Ronquidos (7A41)',
      'Fibrosis pulmonar (BlockL1-CB0)', 'Otro (Especifique)'
    ]},
    { id: 'c4_6', label: '4.6 Visión y ojos', diseases: [
      'Cataratas (9B10)', 'Glaucoma (BlockL1-9C6)', 'Problemas de graduación (9D00)',
      'Retinopatía diabética (9B71.0)', 'Otro (Especifique)'
    ]},
    { id: 'c4_7', label: '4.7 Estómago, intestino y digestión', diseases: [
      'Gastritis o úlceras (DA42)', 'Reflujo (DA22)', 'Colitis o intestino irritable (DD91.0)',
      'Enfermedad inflamatoria intestinal (BlockL1-DD7)', 'Piedras en la vesícula (DC11)', 'Otro'
    ]},
    { id: 'c4_8', label: '4.8 Hígado, riñón y páncreas', diseases: [
      'Hígado graso no alcohólico (DB92)', 'Hígado graso por alcohol (DB94)',
      'Hepatitis por virus (BlockL1-1E5)', 'Cirrosis o daño hepático (DB93)',
      'Enfermedad renal crónica (GB61)', 'Piedras en los riñones (GB70.0)',
      'Pancreatitis (BlockL1-DC3)', 'Otro'
    ]},
    { id: 'c4_9', label: '4.9 Huesos, músculos y articulaciones', diseases: [
      'Artritis reumatoide (BlockL2-FA2)', 'Osteoporosis / Huesos frágiles (FB83)',
      'Desgaste de articulaciones (BlockL2-FA0)', 'Fibromialgia (MG30.01)', 'Otro (Especifique)'
    ]},
    { id: 'c4_10', label: '4.10 Piel, cabello y uñas', diseases: [
      'Piel sensible o dermatitis (BlockL2-EA8)', 'Psoriasis (EA90)', 'Vitiligo (ED63.0)',
      'Alopecia o caída del pelo (ED70)', 'Otro (Especifique)'
    ]},
    { id: 'c4_11', label: '4.11 Cáncer y tumores', diseases: [
      'Cáncer de mama (BlockL3-2C6)', 'Cáncer de próstata (2C82)', 'Cáncer de colon (2B90)',
      'Leucemia (2B33)', 'Cáncer de ovario (2C73)', 'Otro (Especifique)'
    ]},
    { id: 'c4_12', label: '4.12 Enfermedades hereditarias y autoinmunes', diseases: [
      'Síndrome de Down (LD40.0)', 'Lupus (4A40)', 'Esclerosis múltiple (8A40)',
      'Fibrosis quística (CA25)', 'Otro (Especifique)'
    ]},
    { id: 'c4_13', label: '4.13 Enfermedades de la sangre', diseases: [
      'Anemia (BlockL1-3A0)', 'Problemas de coagulación (BlockL1-3B1)', 'Várices (BD74)',
      'Trombosis venosa (BD71)', 'Otro (Especifique)'
    ]},
  ];

  // ---- State --------------------------------------------------------------
  // `matrix` maps a composite disease key to the Set of members that have it.
  // `otherSpecs` holds the custom "Otro" text per coordinate. `activeFilter`
  // drives the category quick filters; `catStates` remembers collapsed
  // categories across re-renders.
  const matrix = {};
  const otherSpecs = {};
  let activeFilter = null;
  let catStates = {};

  // Toggles a standard (non-"Otro") disease for a member in the matrix Set and
  // refreshes only the summary counter — the grid itself is NOT rebuilt here,
  // so the checkbox keeps the browser's native toggle animation.
  function toggleCheck(fi, disease) {
    if (!matrix[disease]) matrix[disease] = new Set();
    const s = matrix[disease];
    if (s.has(fi)) s.delete(fi);
    else s.add(fi);
    if (s.size === 0) delete matrix[disease];
    updateCount();
  }

  // True when `fi` has the given disease checked. Uses optional chaining so an
  // unknown disease key safely returns false.
  function isChecked(fi, disease) {
    return matrix[disease]?.has(fi) ?? false;
  }

  // Toggles a custom "Otro" cell for (member, category):
  //  - First click: creates the coordinate key with an empty string, then
  //    re-renders and focuses the fresh spec input so the user can type
  //    immediately.
  //  - Second click (while a spec exists): deletes the entry and re-renders,
  //    reverting the cell back to a checkbox.
  function toggleOther(fi, catId, disease) {
    const key = catId + '||' + disease + '||' + fi;
    if (otherSpecs[key] !== undefined) {
      delete otherSpecs[key];
      updateCount();
      render();
    } else {
      otherSpecs[key] = '';
      updateCount();
      render();
      const input = document.querySelector(`.spec-input[data-spec="${key}"]`);
      if (input) input.focus();
    }
  }

  // Wipes all interaction state (matrix ticks, custom texts, collapsed
  // categories) after a confirmation, then rebuilds the grid from scratch.
  function resetAll() {
    if (!confirm('¿Borrar todos los datos ingresados?\nEsta acción eliminará todas las selecciones y textos especificados en la matriz.')) return;
    Object.keys(matrix).forEach(k => delete matrix[k]);
    Object.keys(otherSpecs).forEach(k => delete otherSpecs[k]);
    catStates = {};
    render();
    updateCount();
  }

  // Global total shown in the app bar: every member in the matrix Sets plus
  // one for each custom "Otro" coordinate that has an entry.
  function updateCount() {
    let total = 0;
    for (const disease in matrix) total += matrix[disease].size;
    total += Object.keys(otherSpecs).length;
    document.getElementById('totalChecked').textContent = total;
  }

  // capSpec: final form used for STORAGE. Trims both ends and capitalizes the
  // first letter of every word ("otro padre" -> "Otro Padre"). The capitalized
  // value is the REAL stored value so exports (e.g. Excel) receive
  // already-formatted text. No CSS text-transform is used.
  function capSpec(s) {
    return (s || '').trim().replace(/(^|\s)(\S)/g, (_, p1, p2) => p1 + p2.toUpperCase());
  }

  // capFirst: LIVE version used inside oninput while the user is typing. It
  // capitalizes words but deliberately does NOT trim the trailing space —
  // trimming on every keystroke would eat the space between words and prevent
  // multi-word input ("otro padre" would become "Otropadre"). The final trim
  // happens on blur via capSpec.
  function capFirst(s) {
    return (s || '').replace(/(^|\s)(\S)/g, (_, p1, p2) => p1 + p2.toUpperCase());
  }

  // Builds the whole grid HTML:
  //  1. Header row: "Padecimiento" + one column per family member.
  //  2. One `.mg-cat` banner per category (collapsible via catStates) followed
  //     by one `.mg-row` per disease. Every cell is a checkbox carrying
  //     `data-fi` + `data-disease` (composite key). "Otro" rows read their
  //     coordinate from otherSpecs: if an entry exists the cell becomes a
  //     `.spec-input` (with the text as a `title` tooltip), otherwise a plain
  //     checkbox. `data-spec` carries the coordinate key for the input/change
  //     listeners.
  //  3. Summary row with the per-member totals (standard ticks + "Otro" cells).
  function render() {
    const grid = document.getElementById('matrixGrid');
    let html = '';

    html += `<div class="mg-header">Padecimiento</div>`;
    familyMembers.forEach(fm => {
      html += `<div class="mg-header">${fm}</div>`;
    });

    categories.forEach(c => {
      const catOpen = catStates[c.id] !== false;
      html += `<div class="mg-cat${catOpen ? '' : ' closed'}" onclick="toggleCat('${c.id}')" id="catHdr_${c.id}">`;
      html += `<span class="chevron">▾</span> ${c.label}</div>`;

      c.diseases.forEach(d => {
        const codeMatch = d.match(/\(([^)]+)\)$/);
        const code = codeMatch ? codeMatch[1] : '';
        const name = codeMatch ? d.slice(0, d.lastIndexOf('(')).trim() : d;
        const key = c.id + '||' + d;
        const isOther = d === 'Otro' || d === 'Otro (Especifique)';
        html += `<div class="mg-row" data-cat="${c.id}"${catOpen ? '' : ' style="display:none"'}>`;
        html += `<div class="cell">${name}${code ? `<span class="code">${code}</span>` : ''}</div>`;
        familyMembers.forEach((fm, fi) => {
            if (isOther) {
            const specKey = c.id + '||' + d + '||' + fi;
            const specVal = otherSpecs[specKey];
            if (specVal !== undefined) {
              html += `<div class="cell"><input type="text" class="spec-input" value="${specVal.replace(/"/g, '&quot;')}" title="${specVal.replace(/"/g, '&quot;')}" data-spec="${specKey}" placeholder="Especifique..." size="10"></div>`;
            } else {
              html += `<div class="cell"><input type="checkbox" data-fi="${fi}" data-disease="${key.replace(/"/g, '&quot;')}"></div>`;
            }
          } else {
            const chk = isChecked(fi, key);
            html += `<div class="cell"><input type="checkbox" data-fi="${fi}" data-disease="${key.replace(/"/g, '&quot;')}" ${chk ? 'checked' : ''}></div>`;
          }
        });
        html += `</div>`;
      });
    });

    html += `<div class="mg-summary">`;
    html += `<div class="sc">Total por familiar</div>`;
    const totals = familyMembers.map((_, fi) => {
      let t = 0;
      for (const disease in matrix) if (matrix[disease].has(fi)) t++;
      for (const sk in otherSpecs) if (parseInt(sk.split('||')[2]) === fi) t++;
      return t;
    });
    totals.forEach(t => {
      html += `<div class="sc"><span class="num">${t}</span></div>`;
    });
    html += `</div>`;

    grid.innerHTML = html;
  }

  // Collapses/expands a category banner. Rows are hidden via inline
  // `display:none` (state is remembered in catStates so it survives re-renders
  // triggered by checkboxes/inputs) and the chevron flips via `.closed`.
  function toggleCat(catId) {
    catStates[catId] = catStates[catId] === false ? true : false;
    const rows = document.querySelectorAll(`.mg-row[data-cat="${catId}"]`);
    rows.forEach(r => r.style.display = catStates[catId] ? '' : 'none');
    document.getElementById('catHdr_' + catId).classList.toggle('closed');
  }

  // Immediate (non-debounced) filter: hides rows whose disease name doesn't
  // match the search query AND/OR the active category filter. Unlike the other
  // two views there are no wrapping category cards to hide, so rows are toggled
  // directly.
  function filterDiseases() {
    const q = document.getElementById('searchInput')?.value?.toLowerCase() || '';
    document.querySelectorAll('.mg-row').forEach(row => {
      const name = row.querySelector('.cell:first-child').textContent.toLowerCase();
      const cat = row.dataset.cat;
      const match = (!activeFilter || cat === activeFilter) && (!q || name.includes(q));
      row.style.display = match ? '' : 'none';
    });
  }

  // Populates the filter bar: a search input + "Todas" + one quick button per
  // category + the red "Limpiar todo" button. Called once at startup only —
  // calling it inside resetAll() would duplicate the controls on each reset.
  function renderFilterBar() {
    const bar = document.getElementById('filterBar');
    const search = document.createElement('input');
    search.id = 'searchInput';
    search.type = 'text';
    search.placeholder = 'Buscar enfermedad...';
    search.style.cssText = 'padding:8px 16px;border-radius:999px;border:1px solid var(--outline-variant);background:var(--surface);font-family:var(--font);font-size:.82rem;outline:none;flex:1;min-width:160px;';
    search.oninput = filterDiseases;
    bar.appendChild(search);

    const all = document.createElement('button');
    all.className = 'filter-btn active'; all.textContent = 'Todas';
    all.onclick = () => { activeFilter = null; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); all.classList.add('active'); filterDiseases(); };
    bar.appendChild(all);

    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'; btn.textContent = c.label.split(' ')[0];
      btn.onclick = () => { activeFilter = c.id; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); filterDiseases(); };
      bar.appendChild(btn);
    });

    const resetBtn = document.createElement('button');
    resetBtn.className = 'filter-btn reset-btn';
    resetBtn.innerHTML = '<span class="material-symbols-rounded">refresh</span> Limpiar todo';
    resetBtn.onclick = resetAll;
    bar.appendChild(resetBtn);
  }

  // Change listener for the grid checkboxes. Distinguishes the two cases from
  // the disease key's second segment:
  //  - "Otro"/"Otro (Especifique)" -> toggleOther (turns the cell into an input)
  //  - standard disease -> toggleCheck + re-render (to refresh summary state)
  document.addEventListener('change', function(e) {
    if (e.target.matches('.mg-row input[type="checkbox"]')) {
      const fi = parseInt(e.target.dataset.fi);
      const disease = e.target.dataset.disease;
      const parts = disease.split('||');
      const rawDisease = parts.length === 2 ? parts[1] : disease;
      if (rawDisease === 'Otro' || rawDisease === 'Otro (Especifique)') {
        toggleOther(fi, parts[0], rawDisease);
      } else {
        toggleCheck(fi, disease);
        render();
      }
    }
  });

  // Live input listener for the custom "Otro" fields: capitalizes in real time
  // (capFirst), persists the text into otherSpecs and mirrors it to the
  // `title` tooltip (the column is too narrow to read long values inline). No
  // re-render, so the input keeps focus.
  document.addEventListener('input', function(e) {
    if (e.target.matches('.spec-input')) {
      e.target.value = capFirst(e.target.value);
      otherSpecs[e.target.dataset.spec] = e.target.value;
      e.target.title = e.target.value;
    }
  });

  // When a custom "Otro" field is blurred: an EMPTY value is treated as if the
  // cell were never activated (entry removed, grid re-renders, cell reverts to
  // a checkbox); a non-empty value is finalized with capSpec (trim + capitalize
  // the last word), stored and shown, so storage always keeps the clean form.
  document.addEventListener('focusout', function(e) {
    if (e.target.matches('.spec-input')) {
      if (e.target.value === '') {
        delete otherSpecs[e.target.dataset.spec];
        render();
      } else {
        e.target.value = capSpec(e.target.value);
        otherSpecs[e.target.dataset.spec] = e.target.value;
        e.target.title = e.target.value;
      }
    }
  });

  // ---- Startup -------------------------------------------------------------
  renderFilterBar();   // search + filters + "Limpiar todo" (single call)
  render();            // initial grid render
</script>
</body>
</html>
